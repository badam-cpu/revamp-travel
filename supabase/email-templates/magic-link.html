<!-- Supabase → Authentication → Email Templates → "Magic Link"
     Subject: Your sign-in link · revamp. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ec;margin:0;padding:32px 0;font-family:Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#ffffff;border:1px solid #eceae4;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="padding:32px 36px 8px;">
            <span style="font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#212121;">revamp<span style="color:#F15822;">.</span></span>
          </td>
        </tr>
        <tr>
          <td style="padding:12px 36px 0;">
            <h1 style="margin:0;font-size:26px;line-height:1.2;letter-spacing:-0.02em;color:#212121;">Your sign-in link</h1>
            <p style="margin:16px 0 0;font-size:15px;line-height:1.6;color:#4a4a4a;">Tap the button below to sign in to Revamp Travel. No password needed — the link is good for a limited time.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 36px 8px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#F15822;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;padding:14px 26px;border-radius:12px;">Sign in to Revamp</a>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 36px 0;">
            <p style="margin:0;font-size:13px;line-height:1.6;color:#8a8a8a;">
              If the button doesn't work, copy and paste this link:<br />
              <a href="{{ .ConfirmationURL }}" style="color:#F15822;word-break:break-all;">{{ .ConfirmationURL }}</a>
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 36px 32px;border-top:1px solid #eceae4;">
            <p style="margin:16px 0 0;font-size:12px;line-height:1.6;color:#a0a0a0;">If you didn't try to sign in, you can safely ignore this email.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
