<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Revamp Vacations — Stays, Tours &amp; Experiences in Armenia</title>
    <meta name="description" content="Curated places to stay, Armenian restaurants, local tours, and memorable routes across Armenia." />
    <meta name="theme-color" content="#F5F0E7" />
    <!-- Default social-share preview. JS-executing crawlers (Googlebot) and our
         recognized bots (server/prerender.ts) get per-page OG tags; this static
         fallback guarantees a valid image + title for every OTHER link scraper —
         messaging apps, Airbnb threads, etc. — that only reads the raw shell.
         Absolute URLs are required (scrapers don't resolve root-relative paths). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Revamp Vacations" />
    <meta property="og:title" content="Revamp Vacations — Stays, Tours & Experiences in Armenia" />
    <meta property="og:description" content="Curated places to stay, Armenian restaurants, local tours, and memorable routes across Armenia." />
    <meta property="og:url" content="https://revampvacations.com/" />
    <meta property="og:image" content="https://revampvacations.com/images/og-cover.jpg" />
    <meta property="og:image:secure_url" content="https://revampvacations.com/images/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Revamp Vacations — Armenia" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Revamp Vacations — Stays, Tours & Experiences in Armenia" />
    <meta name="twitter:description" content="Curated places to stay, Armenian restaurants, local tours, and memorable routes across Armenia." />
    <meta name="twitter:image" content="https://revampvacations.com/images/og-cover.jpg" />
    <link rel="icon" type="image/svg+xml" href="/brand/revamp-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Armenian:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
